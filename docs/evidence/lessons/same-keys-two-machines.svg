<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-label="The same keys go to three machines. All three give the same outcome. The last digit of the speed differs on one of them.">
  <style>
    text { font-family: system-ui, sans-serif; font-size: 15px; fill: #1b1f24; }
    .small { font-size: 13px; fill: #444; }
    .box { fill: #eef3f8; stroke: #4a6a8a; stroke-width: 1.5; }
    .ok { fill: #e6f4e6; stroke: #3d8a3d; stroke-width: 1.5; }
    .diff { fill: #fff1dc; stroke: #c27a10; stroke-width: 1.5; }
    .arrow { stroke: #4a6a8a; stroke-width: 2; fill: none; marker-end: url(#a); }
  </style>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4a6a8a"/></marker></defs>
  <rect class="box" x="15" y="110" width="130" height="80" rx="8"/>
  <text x="80" y="145" text-anchor="middle">Same keys</text>
  <text x="80" y="167" text-anchor="middle" class="small">+ same course</text>
  <rect class="box" x="230" y="20" width="200" height="70" rx="8"/>
  <text x="330" y="48" text-anchor="middle">Node 24 (V8 13.6)</text>
  <text x="330" y="70" text-anchor="middle" class="small">laptop</text>
  <rect class="box" x="230" y="115" width="200" height="70" rx="8"/>
  <text x="330" y="143" text-anchor="middle">Node 22 (V8 12.4)</text>
  <text x="330" y="165" text-anchor="middle" class="small">other machine</text>
  <rect class="box" x="230" y="210" width="200" height="70" rx="8"/>
  <text x="330" y="238" text-anchor="middle">workerd</text>
  <text x="330" y="260" text-anchor="middle" class="small">Cloudflare runtime</text>
  <path class="arrow" d="M145,140 L228,60"/>
  <path class="arrow" d="M145,150 L228,150"/>
  <path class="arrow" d="M145,160 L228,245"/>
  <rect class="ok" x="520" y="20" width="185" height="70" rx="8"/>
  <text x="612" y="48" text-anchor="middle">Cleared at tick 1204</text>
  <text x="612" y="70" text-anchor="middle" class="small">speed 4.1234567890123456</text>
  <rect class="ok" x="520" y="115" width="185" height="70" rx="8"/>
  <text x="612" y="143" text-anchor="middle">Cleared at tick 1204</text>
  <text x="612" y="165" text-anchor="middle" class="small">speed 4.123456789012345<tspan font-weight="bold" fill="#c27a10">7</tspan></text>
  <rect class="ok" x="520" y="210" width="185" height="70" rx="8"/>
  <text x="612" y="238" text-anchor="middle">Cleared at tick 1204</text>
  <text x="612" y="260" text-anchor="middle" class="small">speed 4.1234567890123456</text>
  <path class="arrow" d="M430,55 L518,55"/>
  <path class="arrow" d="M430,150 L518,150"/>
  <path class="arrow" d="M430,245 L518,245"/>
</svg>
