<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Usage (owner only)</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; margin: 24px auto; max-width: 980px; padding: 0 16px; color: #1c1c1c; background: #fafafa; }
  table { border-collapse: collapse; width: 100%; margin: 8px 0 24px; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid #ddd; }
  td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
  tr.hot td { background: #fde2e2; color: #8a1010; }
  button { font: inherit; padding: 4px 12px; cursor: pointer; }
  .note { color: #555; font-size: 14px; }
  #msg { min-height: 1.5em; color: #8a1010; }
</style>
</head>
<body>
<h1>Usage and switches</h1>
<p class="note">Owner only. Numbers are a rough estimate, not billing. A row turns red at 70% of its daily limit.</p>
<p id="msg" role="status"></p>
<div id="app"></div>
<script type="module" src="./admin.js"></script>
</body>
</html>
