# Cloudflare Pages: the game is static files (dist/) plus one function (functions/api/submit.ts) that stores feedback in D1.
name = "conquercourse"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "conquercourse-feedback"
database_id = "153f511c-2d03-4442-b7cb-9f988a84becd"

# Preview deployments use their own database, so a test never touches the live one (CC-221, CC-108).
[env.preview]

[[env.preview.d1_databases]]
binding = "DB"
database_name = "conquercourse-preview"
database_id = "caae6c2c-c542-4551-94ea-63b3e45e59d7"
